<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — ShopSphere</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body><header class="topbar"><a class="brand" href="/">ShopSphere<span>.</span></a><nav><a href="/">Shop</a><a href="/cart">Cart</a></nav></header><main class="auth-wrap"><form id="auth-form" class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1 id="form-title">Sign in</h1><p class="muted">Use your account to place and track orders.</p><label id="name-label" class="hidden">Full name<input id="full_name" autocomplete="name"></label><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="8" autocomplete="current-password"></label><button class="button full" type="submit" id="submit-btn">Sign in</button><p id="message" role="status"></p><p class="muted"><span id="switch-copy">New here?</span> <button type="button" class="link-button" id="switch-mode">Create an account</button></p></form></main><script src="/static/js/api.js"></script><script>
let mode="login";const form=document.querySelector("#auth-form");
document.querySelector("#switch-mode").onclick=()=>{mode=mode==="login"?"register":"login";document.querySelector("#form-title").textContent=mode==="login"?"Sign in":"Create account";document.querySelector("#submit-btn").textContent=mode==="login"?"Sign in":"Create account";document.querySelector("#name-label").classList.toggle("hidden",mode==="login");document.querySelector("#full_name").required=mode==="register";document.querySelector("#switch-copy").textContent=mode==="login"?"New here?":"Already registered?";document.querySelector("#switch-mode").textContent=mode==="login"?"Create an account":"Sign in";document.querySelector("#password").autocomplete=mode==="login"?"current-password":"new-password";};
form.onsubmit=async e=>{e.preventDefault();const message=document.querySelector("#message");message.textContent="Working…";try{const payload={email:document.querySelector("#email").value,password:document.querySelector("#password").value};if(mode==="register")payload.full_name=document.querySelector("#full_name").value;const data=await apiRequest("/auth/"+(mode==="login"?"login":"register"),{method:"POST",body:JSON.stringify(payload)});localStorage.setItem("access_token",data.access_token);message.textContent="Signed in successfully. Redirecting…";location.href="/";}catch(err){message.textContent=err.message;}};
</script></body></html>
